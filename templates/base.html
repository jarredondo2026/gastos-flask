<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Control de Gastos{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
<span class="marca">Control de Gastos</span>
<div class="enlaces">
{% if session.get('id_usuario') %}
<a href="{{ url_for('gastos') }}">Gastos</a>
<a href="{{ url_for('reporte') }}">Reporte</a>
<a href="{{ url_for('logout') }}">Salir ({{ session['usuario'] }})</a>
{% endif %}
</div>
</nav>
<main>
{% with mensajes = get_flashed_messages(with_categories=true) %}
{% for categoria, mensaje in mensajes %}
<div class="alerta {{ categoria }}">{{ mensaje }}</div>
{% endfor %}
{% endwith %}
{% block contenido %}{% endblock %}
</main>
</body>
</html>
